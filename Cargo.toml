[package]
name = "hf"
version = "0.6.0"
edition = "2024"
rust-version = "1.85.0"
description = "Cross-platform hidden file library and utility"
documentation = "https://docs.rs/hf"
homepage = "https://sorairolake.github.io/hf/"
repository = "https://github.com/sorairolake/hf"
license = "Apache-2.0 OR MIT"
keywords = ["hidden"]
categories = ["command-line-utilities", "filesystem"]
include = ["/LICENSES", "/README.md", "/src"]

[[bin]]
name = "hf"
required-features = ["application"]

[dependencies]
anyhow = { version = "1.0.102", optional = true }
clap = { version = "4.5.60", features = ["derive", "wrap_help"], optional = true }
clap_complete = { version = "4.5.66", optional = true }
clap_complete_nushell = { version = "4.6.0", optional = true }
log = { version = "0.4.29", optional = true }
simplelog = { version = "0.12.2", optional = true }
sysexits = { version = "0.11.0", optional = true }

[dev-dependencies]
anyhow = "1.0.102"
assert_cmd = "2.1.2"
clap = { version = "4.5.60", features = ["derive"] }
predicates = "3.1.4"
tempfile = "3.26.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[features]
default = ["application"]
application = [
  "dep:anyhow",
  "dep:clap",
  "dep:clap_complete",
  "dep:clap_complete_nushell",
  "dep:log",
  "dep:simplelog",
  "dep:sysexits",
]

[lints.clippy]
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
